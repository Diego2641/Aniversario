<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ariel y Maria ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0d020a;
            color: #ffffff;
            overflow-x: hidden;
            user-select: none;
        }
        .font-dancing {
            font-family: 'Dancing Script', cursive;
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(255, 42, 117, 0.6);
        }
        .glass-card {
            background: rgba(20, 5, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 42, 117, 0.3);
            box-shadow: 0 0 40px rgba(255, 42, 117, 0.15);
        }
        .tab-button.active {
            color: #ff2a75;
            border-bottom: 2px solid #ff2a75;
        }
        .heart-particle {
            position: fixed;
            color: #ff2a75;
            pointer-events: none;
            animation: floatUp linear forwards;
            z-index: 0;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 relative">

    <div id="particles"></div>

    <!-- Header / Reproductor de Audio Flotante -->
    <header class="w-full max-w-md flex justify-between items-center z-10 py-2">
        <span class="text-xs uppercase tracking-widest text-pink-400 font-semibold">Aniversario Especial</span>
        <button onclick="toggleMusic(event)" class="bg-pink-950/60 border border-pink-500/40 text-pink-300 px-3 py-1.5 rounded-full text-xs flex items-center gap-2 hover:bg-pink-900/60 transition">
            <i id="musicIcon" class="fa-solid fa-music">
            <span id="musicText">Toca para música</span>
        </button>
    </header>

    <!-- Contenido Principal -->
    <main class="w-full max-w-md my-auto z-10">
        <div class="glass-card rounded-3xl p-6 text-center space-y-6">
            <h1 class="text-4xl md:text-5xl font-dancing text-pink-500 glow-text">Ariel & Maria</h1>
            
            <div class="relative w-32 h-32 mx-auto rounded-full p-1 bg-gradient-to-tr from-pink-500 to-purple-600 shadow-lg shadow-pink-500/30">
                <img src="image_321cd7.jpg" alt="Foto Juntos" class="w-full h-full object-cover rounded-full">
            </div>

            <div class="space-y-2">
                <h2 class="text-xl font-bold">¡Feliz Aniversario, Mi Amor! ❤️</h2>
                <p class="text-sm text-gray-300 leading-relaxed">Cada segundo a tu lado es mi momento favorito del día.</p>
            </div>

            <button class="w-full bg-gradient-to-r from-pink-600 to-purple-600 text-white font-semibold py-3 rounded-xl shadow-lg shadow-pink-600/30 hover:opacity-90 transition">
                JUNTOS CONSTRUYENDO NUESTRA HISTORIA
            </button>
        </div>
    </main>

    <!-- Elemento de Audio Local -->
    <audio id="bgMusic" loop preload="auto">
        <source src="musica.mp3" type="audio/mp3">
    </audio>

    <!-- Script de Reproducción Automática al Toque -->
    <script>
        var audio = document.getElementById("bgMusic");
        var isPlaying = false;

        function toggleMusic(event) {
            if (event) event.stopPropagation();
            if (!isPlaying) {
                audio.play();
                isPlaying = true;
                document.getElementById('musicIcon').className = "fa-solid fa-compact-disc animate-spin text-pink-500";
                document.getElementById('musicText').innerText = "Sonando";
            } else {
                audio.pause();
                isPlaying = false;
                document.getElementById('musicIcon').className = "fa-solid fa-music";
                document.getElementById('musicText').innerText = "Reproducir";
            }
        }

        // Activa la música con el primer toque en cualquier parte de la pantalla
        document.addEventListener('click', function() {
            if (audio && audio.paused && !isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    document.getElementById('musicIcon').className = "fa-solid fa-compact-disc animate-spin text-pink-500";
                    document.getElementById('musicText').innerText = "Sonando";
                }).catch(() => {});
            }
        }, { once: true });

        // Partículas de Corazones
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-particle fa-solid fa-heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.getElementById('particles').appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>
